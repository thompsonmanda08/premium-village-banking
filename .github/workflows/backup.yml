name: Nightly encrypted backup
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0   # matches the supabase devDependency in bun.lock
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Check the secrets this job needs
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          missing=""
          [ -n "$DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$AGE_RECIPIENT" ] || missing="$missing AGE_RECIPIENT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (docs/ops/setup.md, backup section)"
            exit 1
          fi
          case "$DB_URL" in
            *pooler.supabase.com:5432/*) ;;
            *) echo "::error::SUPABASE_DB_URL must be the Session pooler string (port 5432). The direct db.<ref>.supabase.co host is IPv6-only and GitHub runners cannot reach it."; exit 1 ;;
          esac
      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only
          # A dump that silently lost the app or login data is worse than a failed run.
          grep -Eq '^COPY "?public"?\."?members"? ' backup/data.sql
          grep -Eq '^COPY "?auth"?\."?users"? ' backup/data.sql
          tar czf backup.tar.gz backup
      - name: Encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: age -r "$AGE_RECIPIENT" -o "pvb-$(date -u +%F).tar.gz.age" backup.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pvb-backup-${{ github.run_id }}
          path: pvb-*.tar.gz.age
          if-no-files-found: error
          retention-days: 90
