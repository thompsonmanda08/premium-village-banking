name: Deploy database and functions
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one halfway through a migration.
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  # A push deploys only after CI is green on the same commit, so the approval below is never the only check.
  # Running the workflow by hand (workflow_dispatch) skips this gate on purpose, for emergencies.
  ci-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 70); do
            read -r status conclusion < <(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none")"')
            echo "CI: $status $conclusion"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::CI did not pass on this commit ($conclusion); not deploying to production."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI did not finish within 35 minutes; not deploying."
          exit 1

  deploy:
    needs: ci-gate
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.ci-gate.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production   # requires approval from a reviewer configured in repo settings
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0   # matches the supabase devDependency in bun.lock
      - run: supabase link --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Show pending migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase functions deploy invite-member --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
